<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The FrameSong pipeline: your photos, plan with Claude, redraw, animate, song, edit with FFmpeg, finished movie, and 4K next.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d121e"/><stop offset="1" stop-color="#18203a"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#f07ac8"/><stop offset="1" stop-color="#f07ac8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="600" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .head { font-weight: 700; font-size: 15px; letter-spacing: 3px; fill: #f07ac8; }
    .t { font-weight: 800; font-size: 24px; fill: #ffffff; }
    .s { font-weight: 600; font-size: 14.5px; fill: #c9d0dd; }
    .m { font-size: 14px; fill: #9aa3b5; }
    .num { font-weight: 800; font-size: 15px; fill: #2a0a1f; }
    .foot { font-size: 15px; fill: #aab3c5; }
    .soon { font-weight: 700; font-size: 12px; letter-spacing: 2px; fill: #6fd3a0; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="600" fill="url(#bg)"/>
    <text x="60" y="64" class="head">THE FRAMESONG PIPELINE</text>
    <text x="1140" y="64" text-anchor="end" class="m">a glowing dot follows one movie through every step</text>

    <!-- Flowing connector line -->
    <path d="M180 175 L460 175 L740 175 L1020 175 L1020 405 L740 405 L460 405" fill="none" stroke="#303a52" stroke-width="4" stroke-linejoin="round"/>
    <path d="M180 175 L460 175 L740 175 L1020 175 L1020 405 L740 405 L460 405" fill="none" stroke="#f07ac8" stroke-width="4" stroke-linejoin="round" stroke-dasharray="8 14" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- Movie to 4K: next step, dashed -->
    <path d="M460 405 L180 405" fill="none" stroke="#6fd3a0" stroke-width="3" stroke-dasharray="4 10" opacity="0.6"/>

    <g>
      <rect x="60" y="110" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="60" y="110" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="1.000;1.000;0.000;0.000" keyTimes="0.000;0.050;0.140;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="90" cy="142" r="15" fill="#f07ac8"/>
      <text x="90" y="147" text-anchor="middle" class="num">1</text>
      <text x="116" y="150" class="t">Your photos</text>
      <text x="80" y="192" class="s">3 to 20 photos</text>
      <text x="80" y="216" class="m">pick a look and a song</text>
    </g>
    <g>
      <rect x="340" y="110" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="340" y="110" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;0.000;0.000" keyTimes="0.000;0.128;0.148;0.248;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="370" cy="142" r="15" fill="#f07ac8"/>
      <text x="370" y="147" text-anchor="middle" class="num">2</text>
      <text x="396" y="150" class="t">Plan</text>
      <text x="360" y="192" class="s">Claude Sonnet 5.5</text>
      <text x="360" y="216" class="m">story · motion · lyrics</text>
    </g>
    <g>
      <rect x="620" y="110" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="620" y="110" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;0.000;0.000" keyTimes="0.000;0.275;0.295;0.395;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="650" cy="142" r="15" fill="#f07ac8"/>
      <text x="650" y="147" text-anchor="middle" class="num">3</text>
      <text x="676" y="150" class="t">Redraw</text>
      <text x="640" y="192" class="s">Nano Banana 2 on fal.ai</text>
      <text x="640" y="216" class="m">3D animated or cartoon</text>
    </g>
    <g>
      <rect x="900" y="110" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="900" y="110" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;0.000;0.000" keyTimes="0.000;0.423;0.443;0.543;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="930" cy="142" r="15" fill="#f07ac8"/>
      <text x="930" y="147" text-anchor="middle" class="num">4</text>
      <text x="956" y="150" class="t">Animate</text>
      <text x="920" y="192" class="s">Veo 3.1 Lite on fal.ai</text>
      <text x="920" y="216" class="m">one clip per shot</text>
    </g>
    <g>
      <rect x="900" y="340" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="900" y="340" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;0.000;0.000" keyTimes="0.000;0.545;0.565;0.665;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="930" cy="372" r="15" fill="#f07ac8"/>
      <text x="930" y="377" text-anchor="middle" class="num">5</text>
      <text x="956" y="380" class="t">Song</text>
      <text x="920" y="422" class="s">MiniMax Music 3 on fal.ai</text>
      <text x="920" y="446" class="m">or your own song</text>
    </g>
    <g>
      <rect x="620" y="340" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="620" y="340" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;0.000;0.000" keyTimes="0.000;0.692;0.712;0.812;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="650" cy="372" r="15" fill="#f07ac8"/>
      <text x="650" y="377" text-anchor="middle" class="num">6</text>
      <text x="676" y="380" class="t">Edit</text>
      <text x="640" y="422" class="s">FFmpeg on your server</text>
      <text x="640" y="446" class="m">cut to the beat</text>
    </g>
    <g>
      <rect x="340" y="340" width="240" height="130" rx="16" fill="#1d2537" stroke="#303a52" stroke-width="2"/>
      <rect x="340" y="340" width="240" height="130" rx="16" fill="#f07ac8" fill-opacity="0.10" stroke="#f07ac8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0.000;0.000;1.000;1.000;0.000" keyTimes="0.000;0.840;0.860;0.970;1.000" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle cx="370" cy="372" r="15" fill="#f07ac8"/>
      <text x="370" y="377" text-anchor="middle" class="num">7</text>
      <text x="396" y="380" class="t">Movie</text>
      <text x="360" y="422" class="s">MP4 to watch</text>
      <text x="360" y="446" class="m">and download</text>
    </g>
    <g>
      <rect x="60" y="340" width="240" height="130" rx="16" fill="#151c2c" stroke="#6fd3a0" stroke-width="2" stroke-dasharray="7 7"/>
      <circle cx="90" cy="372" r="15" fill="none" stroke="#6fd3a0" stroke-width="2"/>
      <text x="90" y="377" text-anchor="middle" class="num" style="fill:#6fd3a0">8</text>
      <text x="116" y="380" class="t">4K</text>
      <text x="210" y="378" class="soon">NEXT</text>
      <text x="80" y="422" class="s">Upscale the movie</text>
      <text x="80" y="446" class="m">sharp 4K download</text>
    </g>
    <circle r="22" fill="url(#dot)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M180 175 L460 175 L740 175 L1020 175 L1020 405 L740 405 L460 405" keyPoints="0;1;1" keyTimes="0;0.86;1" calcMode="linear"/>
    </circle>
    <circle r="6" fill="#ffffff">
      <animateMotion dur="10s" repeatCount="indefinite" path="M180 175 L460 175 L740 175 L1020 175 L1020 405 L740 405 L460 405" keyPoints="0;1;1" keyTimes="0;0.86;1" calcMode="linear"/>
    </circle>

    <!-- Storage bar -->
    <rect x="60" y="514" width="1080" height="50" rx="12" fill="#151c2c" stroke="#303a52" stroke-width="2"/>
    <g transform="translate(86 527)" fill="none" stroke="#6fd3a0" stroke-width="2.5">
      <ellipse cx="11" cy="5" rx="11" ry="4.5"/>
      <path d="M0 5 v15 c0 2.5 5 4.5 11 4.5 s11 -2 11 -4.5 v-15"/>
      <path d="M0 12.5 c0 2.5 5 4.5 11 4.5 s11 -2 11 -4.5"/>
    </g>
    <text x="124" y="545" class="foot">Everything is saved in your private Supabase storage: photos, redraws, clips, the song, and the finished movie.</text>
  </g>
</svg>
