<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="FrameSong: your photos, turned into a short film with its own song">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d121e"/>
      <stop offset="1" stop-color="#1c2333"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f07ac8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f07ac8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb3c8"/><stop offset="1" stop-color="#e9cfa7"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#bfe0ff"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a5e"/><stop offset="1" stop-color="#f07ac8"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="380" rx="24"/></clipPath>

    <!-- One frame of film: a little landscape. Four looks, like FrameSong's styles. -->
    <g id="f1">
      <rect width="170" height="96" rx="4" fill="url(#sky1)"/>
      <circle cx="122" cy="34" r="14" fill="#fff6dc" opacity="0.9"/>
      <path d="M0 96 Q60 52 120 70 T170 64 V96Z" fill="#5b6b4a"/>
    </g>
    <g id="f2">
      <rect width="170" height="96" rx="4" fill="url(#sky2)"/>
      <circle cx="120" cy="34" r="16" fill="#ffd34d"/>
      <path d="M0 96 Q70 46 170 72 V96Z" fill="#7fd36b"/>
    </g>
    <g id="f3">
      <rect width="170" height="96" rx="4" fill="url(#sky3)"/>
      <circle cx="118" cy="34" r="15" fill="#f0775a" stroke="#1a2233" stroke-width="3"/>
      <path d="M0 96 Q85 44 170 96Z" fill="#5fb38f" stroke="#1a2233" stroke-width="3"/>
    </g>
    <g id="f4">
      <rect width="170" height="96" rx="4" fill="url(#sky4)"/>
      <circle cx="40" cy="30" r="2" fill="#fff"/><circle cx="76" cy="18" r="1.6" fill="#fff"/>
      <circle cx="140" cy="26" r="2" fill="#fff"/><circle cx="104" cy="40" r="1.4" fill="#fff"/>
      <path d="M0 96 Q50 60 100 78 T170 70 V96Z" fill="#1d2537"/>
    </g>

    <!-- A strip segment: four frames with sprocket holes, 800px wide, repeated for a seamless loop -->
    <g id="segment">
      <rect width="800" height="140" fill="#0a0e17"/>
      <g fill="#2a3349">
        <rect x="10" y="8" width="16" height="10" rx="2"/><rect x="50" y="8" width="16" height="10" rx="2"/>
        <rect x="90" y="8" width="16" height="10" rx="2"/><rect x="130" y="8" width="16" height="10" rx="2"/>
        <rect x="170" y="8" width="16" height="10" rx="2"/><rect x="210" y="8" width="16" height="10" rx="2"/>
        <rect x="250" y="8" width="16" height="10" rx="2"/><rect x="290" y="8" width="16" height="10" rx="2"/>
        <rect x="330" y="8" width="16" height="10" rx="2"/><rect x="370" y="8" width="16" height="10" rx="2"/>
        <rect x="410" y="8" width="16" height="10" rx="2"/><rect x="450" y="8" width="16" height="10" rx="2"/>
        <rect x="490" y="8" width="16" height="10" rx="2"/><rect x="530" y="8" width="16" height="10" rx="2"/>
        <rect x="570" y="8" width="16" height="10" rx="2"/><rect x="610" y="8" width="16" height="10" rx="2"/>
        <rect x="650" y="8" width="16" height="10" rx="2"/><rect x="690" y="8" width="16" height="10" rx="2"/>
        <rect x="730" y="8" width="16" height="10" rx="2"/><rect x="770" y="8" width="16" height="10" rx="2"/>
        <rect x="10" y="122" width="16" height="10" rx="2"/><rect x="50" y="122" width="16" height="10" rx="2"/>
        <rect x="90" y="122" width="16" height="10" rx="2"/><rect x="130" y="122" width="16" height="10" rx="2"/>
        <rect x="170" y="122" width="16" height="10" rx="2"/><rect x="210" y="122" width="16" height="10" rx="2"/>
        <rect x="250" y="122" width="16" height="10" rx="2"/><rect x="290" y="122" width="16" height="10" rx="2"/>
        <rect x="330" y="122" width="16" height="10" rx="2"/><rect x="370" y="122" width="16" height="10" rx="2"/>
        <rect x="410" y="122" width="16" height="10" rx="2"/><rect x="450" y="122" width="16" height="10" rx="2"/>
        <rect x="490" y="122" width="16" height="10" rx="2"/><rect x="530" y="122" width="16" height="10" rx="2"/>
        <rect x="570" y="122" width="16" height="10" rx="2"/><rect x="610" y="122" width="16" height="10" rx="2"/>
        <rect x="650" y="122" width="16" height="10" rx="2"/><rect x="690" y="122" width="16" height="10" rx="2"/>
        <rect x="730" y="122" width="16" height="10" rx="2"/><rect x="770" y="122" width="16" height="10" rx="2"/>
      </g>
      <use href="#f1" x="15" y="22"/>
      <use href="#f2" x="215" y="22"/>
      <use href="#f3" x="415" y="22"/>
      <use href="#f4" x="615" y="22"/>
    </g>
  </defs>

  <style>
    .title { font: 800 92px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #ffffff; }
    .tag { font: 500 24px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d0dd; }
    .chip { font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #f07ac8; letter-spacing: 2px; }
    .strip { animation: roll 16s linear infinite; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    .note { animation: rise 6s ease-in infinite; opacity: 0; }
    .n2 { animation-delay: 2s; } .n3 { animation-delay: 4s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-120px); opacity: 0; } }
    .bar { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .b2 { animation-delay: -0.3s; } .b3 { animation-delay: -0.6s; } .b4 { animation-delay: -0.15s; } .b5 { animation-delay: -0.45s; }
    @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .strip, .note, .bar { animation: none; opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- Title -->
    <text x="600" y="62" text-anchor="middle" class="chip">PHOTOS → STORY → MOTION → SONG → MOVIE</text>
    <text x="600" y="150" text-anchor="middle" class="title">FrameSong</text>
    <text x="600" y="194" text-anchor="middle" class="tag">Your photos, turned into a short film with its own song.</text>

    <!-- Floating music notes -->
    <g fill="#f07ac8">
      <g class="note" transform="translate(150 230)"><path d="M0 0 v-34 l22 -6 v30" fill="none" stroke="#f07ac8" stroke-width="4"/><ellipse cx="-5" cy="2" rx="8" ry="6"/><ellipse cx="17" cy="-4" rx="8" ry="6"/></g>
      <g class="note n2" transform="translate(1030 236)"><path d="M0 0 v-30" stroke="#f07ac8" stroke-width="4"/><ellipse cx="-5" cy="2" rx="8" ry="6"/></g>
      <g class="note n3" transform="translate(260 240)"><path d="M0 0 v-30" stroke="#6fd3a0" stroke-width="4"/><ellipse cx="-5" cy="2" rx="8" ry="6" fill="#6fd3a0"/></g>
    </g>

    <!-- Equalizer -->
    <g fill="#f07ac8" opacity="0.85">
      <rect class="bar" x="1080" y="196" width="10" height="44" rx="3"/>
      <rect class="bar b2" x="1096" y="196" width="10" height="44" rx="3"/>
      <rect class="bar b3" x="1112" y="196" width="10" height="44" rx="3"/>
      <rect class="bar b4" x="1128" y="196" width="10" height="44" rx="3"/>
      <rect class="bar b5" x="1144" y="196" width="10" height="44" rx="3"/>
    </g>

    <!-- Rolling film strip -->
    <g transform="translate(0 240)">
      <g class="strip">
        <use href="#segment" x="0"/>
        <use href="#segment" x="800"/>
        <use href="#segment" x="1600"/>
      </g>
    </g>
  </g>
</svg>
